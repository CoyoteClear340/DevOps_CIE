apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard-provider, namespace: devops-demo }
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: DevOps Dashboard
        orgId: 1
        folder: DevOps Demo
        type: file
        disableDeletion: false
        editable: true
        options: { path: /var/lib/grafana/dashboards }
