apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-demo

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: nginx-exporter
        static_configs:
          - targets:
              - "devops-dashboard-metrics.devops-demo.svc.cluster.local:9113"
            labels:
              namespace: devops-demo
              app: devops-dashboard

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - "kube-state-metrics.devops-demo.svc.cluster.local:8080"
            labels:
              namespace: devops-demo
              app: kube-state-metrics