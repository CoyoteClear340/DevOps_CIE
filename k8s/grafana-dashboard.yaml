apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-dashboard, namespace: devops-demo }
data:
  devops-dashboard.json: |
    {
      "title": "DevOps Monitor Dashboard",
      "uid": "devops-monitor",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "panels": [
        {"id":1,"type":"timeseries","title":"HTTP request rate","gridPos":{"h":8,"w":12,"x":0,"y":0},"targets":[{"expr":"rate(nginx_http_requests_total[1m])","legendFormat":"requests/sec"}]},
        {"id":2,"type":"stat","title":"Total HTTP requests","gridPos":{"h":8,"w":6,"x":12,"y":0},"targets":[{"expr":"sum(nginx_http_requests_total)","legendFormat":"requests"}]},
        {"id":3,"type":"timeseries","title":"Active connections","gridPos":{"h":8,"w":6,"x":18,"y":0},"targets":[{"expr":"nginx_connections_active","legendFormat":"active"}]},
        {"id":4,"type":"timeseries","title":"Kubernetes dashboard pods","gridPos":{"h":8,"w":12,"x":0,"y":8},"targets":[{"expr":"count(up{job=\"nginx-exporter\"})","legendFormat":"exporter targets"}]},
        {"id":5,"type":"stat","title":"Exporter target health","gridPos":{"h":8,"w":6,"x":12,"y":8},"targets":[{"expr":"min(up{job=\"nginx-exporter\"})","legendFormat":"up (1=yes)"}]}
      ]
    }
