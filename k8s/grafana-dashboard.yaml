apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard
  namespace: devops-demo

data:
  devops-dashboard.json: |
    {
      "title": "DevOps Monitor Dashboard",
      "uid": "devops-monitor",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "HTTP Request Rate",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rate(nginx_http_requests_total[1m])",
              "legendFormat": "requests/sec"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total HTTP Requests",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(nginx_http_requests_total)",
              "legendFormat": "requests"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Active Connections",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "expr": "nginx_connections_active",
              "legendFormat": "active"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Kubernetes Dashboard Pods",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"devops-demo\",deployment=\"devops-dashboard\"}",
              "legendFormat": "Available Pods"
            },
            {
              "expr": "kube_deployment_spec_replicas{namespace=\"devops-demo\",deployment=\"devops-dashboard\"}",
              "legendFormat": "Desired Pods"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Kubernetes Dashboard Available Pods",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"devops-demo\",deployment=\"devops-dashboard\"}",
              "legendFormat": "Available Pods"
            }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Exporter Target Health",
          "gridPos": {
            "h": 8,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "targets": [
            {
              "expr": "min(up{job=\"nginx-exporter\"})",
              "legendFormat": "up (1=yes)"
            }
          ]
        }
      ]
    }